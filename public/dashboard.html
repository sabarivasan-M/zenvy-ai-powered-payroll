<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENVY - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 class="logo" style="font-size: 1.5rem; margin-bottom: 2rem;">ZENVY</h1>
            <nav>
                <div class="nav-item active" onclick="loadView('home')">Home</div>
                <div class="nav-item" onclick="loadView('employees')">Employees</div>
                <div class="nav-item" onclick="loadView('payroll')">Payroll & AI</div>
            </nav>
            <div style="margin-top: auto;">
                <div class="nav-item" onclick="logout()" style="color: var(--danger)">Logout</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2 id="pageTitle">Overview</h2>
                <div id="userInfo" style="color: var(--text-secondary)"></div>
            </header>

            <!-- Dynamic Views -->
            <div id="viewContainer">
                <!-- Content injected by JS -->
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="addEmployeeModal" class="glass-card"
        style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 100; width: 400px;">
        <h3>Add New Employee</h3>
        <br>
        <form id="addEmpForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="empName" required>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="empEmail" required>
            </div>
            <div class="input-group">
                <label>Base Salary (Annual)</label>
                <input type="number" id="empSalary" required>
            </div>
            <button type="submit" class="cta-btn">Create Employee</button>
            <button type="button" class="cta-btn secondary" style="margin-top: 10px;"
                onclick="closeModal()">Cancel</button>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
